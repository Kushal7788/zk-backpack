name: zk_backpack_app
description: "ZK Backpack Flutter app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  mobile_proof_plugin:
    path: ../../mobile_tlsn_plugin/flutter_plugin
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/provider_catalog.json
    - assets/branding/backpack_logo.png
