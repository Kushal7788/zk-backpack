# Fly.io app config for zk_backpack share_service.
#
# Replace `app` with the slug `flyctl launch` chose for you (or set
# it ahead of time with `flyctl apps create <slug>`). Replace
# `primary_region` with the closest region from `flyctl platform regions`.

app = "zk-backpack-share-service"
primary_region = "iad"

[build]
  # Pure Dockerfile build, no buildpacks.

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the machine running 24/7 so share tokens resolve instantly.
  # Removes Fly's idle-suspend behaviour (which only ever pauses the
  # machine, never destroys it — but cold-start latency is undesirable
  # for a public share viewer).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[mounts]]
  # Persistent volume — proofs.json, shares.json, audit.jsonl and the
  # encrypted proof blobs live here so they survive deploys and
  # restarts. Create it once with:
  #   flyctl volumes create share_service_data --size 1 --region <region>
  source = "share_service_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
